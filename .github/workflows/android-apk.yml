name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Instala cmdline-tools, licencias y platform-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Refuerzo: asegura API 34 + build-tools (el fallo típico del primer build).
      - name: Install Android SDK Platform 34 + Build-Tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Point Gradle to the SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK" > android/local.properties
          test -n "$SDK" && test -d "$SDK" && cat android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Setup Gradle (cache + validación wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Gradle log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/gradle-build.log" || true

      - name: Gradle failure summary
        if: failure()
        run: |
          {
            echo "### Gradle (últimas líneas + errores)"
            echo ""
            echo '```text'
            grep -E "^e: |error: |FAILURE: |What went wrong:|> Task .*FAILED" "$RUNNER_TEMP/gradle-build.log" | tail -n 40 || true
            echo ""
            tail -n 80 "$RUNNER_TEMP/gradle-build.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post Gradle tail to GitHub Issue (debug)
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/gradle-build.log`;
            let tail = '(no log file)';
            try { tail = fs.readFileSync(path, 'utf8').slice(-12000); } catch (e) {}
            const body = `Run **${context.runId}** / \`${context.sha.substring(0, 7)}\`\n\n\`\`\`text\n${tail}\n\`\`\``;
            const q = `repo:${context.repo.owner}/${context.repo.repo} in:title "Android CI log (auto)" is:issue state:open`;
            const { data: found } = await github.rest.search.issuesAndPullRequests({ q });
            if (found.items.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.items[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Android CI log (auto)',
                body: 'Cola del log de Gradle cuando falla **Build Android APK**.\n\n' + body,
              });
            }

      - name: Upload Gradle log artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callonlines-panel-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
