name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Xmx4g -Dorg.gradle.daemon=false -Dkotlin.daemon.jvm.options=-Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Instala cmdline-tools, licencias y platform-tools.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Refuerzo: asegura API 34 + build-tools (el fallo típico del primer build).
      - name: Install Android SDK Platform 34 + Build-Tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Point Gradle to the SDK
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Setup Gradle (cache + validación wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: callonlines-panel-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
